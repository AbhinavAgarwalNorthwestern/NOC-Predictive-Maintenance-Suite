name: Register Metaflow Flows as Step Functions

on:
  push:
    branches: [main]
    paths:
      - "src/battery_pdm/flows/**"
      - "Dockerfile"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: 998716768706.dkr.ecr.ap-south-1.amazonaws.com/battery-pdm-dev

jobs:
  register-step-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::998716768706:role/battery-pdm-dev-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ML image
        run: |
          docker build -t $ECR_REPO:latest .
          docker push $ECR_REPO:latest

      - name: Set up Metaflow config
        run: |
          mkdir -p ~/.metaflowconfig
          cat > ~/.metaflowconfig/config.json <<'EOF'
          {
            "METAFLOW_DEFAULT_DATASTORE": "s3",
            "METAFLOW_DATASTORE_SYSROOT_S3": "s3://battery-pdm-dev-data-998716768706/metaflow",
            "METAFLOW_DEFAULT_METADATA": "local",
            "METAFLOW_BATCH_JOB_QUEUE": "battery-pdm-dev-queue",
            "METAFLOW_BATCH_CONTAINER_IMAGE": "998716768706.dkr.ecr.ap-south-1.amazonaws.com/battery-pdm-dev:latest",
            "METAFLOW_BATCH_CONTAINER_REGISTRY": "998716768706.dkr.ecr.ap-south-1.amazonaws.com",
            "METAFLOW_SFN_IAM_ROLE": "arn:aws:iam::998716768706:role/battery-pdm-dev-sfn-role",
            "METAFLOW_EVENTS_SFN_ACCESS_IAM_ROLE": "arn:aws:iam::998716768706:role/battery-pdm-dev-sfn-events-role",
            "METAFLOW_ECS_S3_ACCESS_IAM_ROLE": "arn:aws:iam::998716768706:role/battery-pdm-dev-task-role"
          }
          EOF

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --frozen

      - name: Register flows as Step Functions (per-step granularity)
        run: |
          for flow in \
            battery_pdm.flows.drain_predictor_flow \
            battery_pdm.flows.drift_monitor_flow \
            battery_pdm.flows.retraining_flow \
            battery_pdm.flows.failure_scoring_flow \
            battery_pdm.flows.shadow_promotion_flow \
            battery_pdm.flows.rollback_monitor_flow; do
            echo "=== Registering $flow ==="
            uv run python -m $flow --with batch --with retry step-functions create
          done

      - name: Verify state machines
        run: |
          aws stepfunctions list-state-machines --region $AWS_REGION \
            --query "stateMachines[?contains(name,'battery_pdm')].{name:name,created:creationDate}" \
            --output table
