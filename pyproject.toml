[project]
name = "battery-pdm"
version = "0.1.0"
description = "Predictive maintenance for telecom battery infrastructure"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pytest>=8.0",
    "mlflow>=3.12.0",
    "metaflow>=2.12",
    "evidently>=0.4,<0.5",
    "pandera[pandas]>=0.20",
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_pdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
